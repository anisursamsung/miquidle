# ==============================================================================
# miquidle Configuration File
# Modern Wayland Idle Daemon for Miquland
# ==============================================================================

[general]
# Command executed when session lock is signaled (via loginctl lock-session or systemd)
lock_cmd = miqulock

# Command executed when session unlock is signaled
unlock_cmd = pkill -USR1 miqulock

# Command executed right before the system suspends/sleeps (handled with delay inhibitor)
before_sleep_cmd = miqulock

# Command executed after system resumes from sleep
# after_sleep_cmd = wlr-randr --output eDP-1 --on

# Whether to ignore systemd sleep delay inhibitors
ignore_sleep_inhibit = false

# Whether to wait for commands to finish before continuing
wait = false

# ==============================================================================
# Idle Listeners
# Multiple listener blocks can be defined with timeout (in seconds),
# on_timeout action, and optional on_resume action.
# ==============================================================================

# Listener 1: Lock screen after 5 minutes of inactivity
listener {
    timeout = 300
    on-timeout = miqulock
}

# Listener 2: Turn off display after 10 minutes of inactivity
listener {
    timeout = 600
    on-timeout = wlr-randr --output eDP-1 --off
    on-resume = wlr-randr --output eDP-1 --on
}

# Listener 3: Suspend system after 30 minutes of inactivity
listener {
    timeout = 1800
    on-timeout = systemctl suspend
}
